version: "3.9"

services:
  backend:
    build: ./backend
    expose:
      - "3001"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /senim
        VITE_BASE_PATH: /senim/
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped