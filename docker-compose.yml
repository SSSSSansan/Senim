version: "3.9"

networks:
  esg-network:
    external: true

services:
  senim-backend:
    build: ./backend
    expose:
      - "3001"
    env_file:
      - ./backend/.env
    networks:
      - esg-network
    restart: unless-stopped

  senim-frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /senim
        VITE_BASE_PATH: /senim/
    expose:
      - "80"
    depends_on:
      - senim-backend
    networks:
      - esg-network
    restart: unless-stopped